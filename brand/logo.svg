  <line x1="16" y1="64" x2="112" y2="64" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  
  <!-- Caliper tick marks along axes -->
  <line x1="61" y1="32" x2="67" y2="32" stroke="#475569" stroke-width="1.5" />
