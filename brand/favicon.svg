<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- rekon · Optical Favicon (Transparent Canvas, Light/Dark Responsive) -->
  <style>
    .reticle { stroke: #64748b; }
    .fulcrum-ring { fill: #f8fafc; }
    .fulcrum-hole { fill: #0f1117; }
    .fulcrum-core { fill: #38bdf8; }
    @media (prefers-color-scheme: light) {
      .reticle { stroke: #94a3b8; }
      .fulcrum-ring { fill: #0f172a; }
      .fulcrum-hole { fill: #ffffff; }
      .fulcrum-core { fill: #0284c7; }
    }
  </style>

  <!-- Coordinate Reticle (The Cross) -->
  <line x1="64" y1="8" x2="64" y2="120" class="reticle" stroke-width="8" stroke-linecap="round" />
  <line x1="8" y1="64" x2="120" y2="64" class="reticle" stroke-width="8" stroke-linecap="round" />
  
  <!-- Upper Ledger Bar: Human Attention (Rose) -->
  <rect x="12" y="28" width="72" height="26" rx="13" fill="#f43f5e" />
  
  <!-- Lower Ledger Bar: Machine Compute (Violet) -->
  <rect x="44" y="74" width="72" height="26" rx="13" fill="#8b5cf6" />
  
  <!-- Central Fulcrum Node (Flat Solid Discs) -->
  <circle cx="64" cy="64" r="16" class="fulcrum-ring" />
  <circle cx="64" cy="64" r="8" class="fulcrum-hole" />
  <circle cx="64" cy="64" r="4" class="fulcrum-core" />
</svg>
